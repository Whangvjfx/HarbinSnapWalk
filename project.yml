name: HarbinSnapWalk
options:
  bundleIdPrefix: com.heu.snapwalk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  HarbinSnapWalk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HarbinSnapWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heu.harbinsnapwalk
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HarbinSnapWalk/Info.plist
      properties:
        CFBundleDisplayName: "随手画步"
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "需要获取位置以显示您在哈工程的实时位置，并将手绘路线贴合至街道路网"
        NSMotionUsageDescription: "需要读取步数协处理器以统计今日已走步数"
